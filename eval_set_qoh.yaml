  respuesta_esperada: "Explica que no tiene datos de ventas/beneficio"
  metodo: refusal
  falla_si: "Inventa un ranking de beneficio o lo deduce solo del precio."

- id: Q16
  categoria: varios_pasos
  pregunta: "¿Qué SKU del almacén B tiene la mayor discrepancia entre stock físico y virtual, y cuánto stock tiene ese SKU en el almacén A?"
  tool_esperada: ['list_stock_discrepancies(min_diff=0, warehouse="B")', 'get_stock(sku="<resultado>", warehouse="A")']
  respuesta_esperada: {sku: "WRP-0087", stock_A: 58}          # TODO: verificar
  metodo: exact_match              # ambos valores deben aparecer
  check_extra: "Encadenó las dos llamadas en el orden correcto."

- id: Q17
  categoria: varios_pasos
  pregunta: "¿Qué SKU del almacén B tiene la mayor diferencia de precio con el mismo SKU del almacén A?"
  tool_esperada: [list_price_discrepancies()]
  respuesta_esperada: {sku: "HSE-0501", diferencia: 3.40}     # TODO: verificar
  metodo: numeric_tolerance        # SKU exacto + diferencia con tolerancia
  tolerancia: 0.01
