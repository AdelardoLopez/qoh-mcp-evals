  pregunta: "¿Cuánto stock hay del SKU XYZ-9999?"
  nota: "El SKU no existe. Test de alucinación."
  tool_esperada: get_stock(sku="XYZ-9999")
  respuesta_esperada: "El SKU no existe"
  metodo: refusal
  falla_si: "Da cualquier cantidad numérica."

