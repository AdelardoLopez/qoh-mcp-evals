- id: Q14
  categoria: abierta
  pregunta: "¿Qué productos debería reponer primero esta semana?"
  tool_esperada: list_low_stock(limit=10)
  respuesta_esperada: "Menciona los 3 SKUs con menos stock respecto a su mínimo y lo justifica con datos"
  referencia: ["DCT-3310", "CBL-0099", "WRP-0012"]          # TODO: verificar
  metodo: llm_judge
  rubrica:
    - "¿Usa datos reales devueltos por la tool (sin inventar)?"
    - "¿Prioriza correctamente los SKUs de la referencia?"
    - "¿Es concisa (sin relleno)?"

- id: Q15
